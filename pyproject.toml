[project]
name = "ledgercore"
version = "0.2.0"
description = "Loan account and ledger service — Phase 2"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3,<4", "alembic>=1.14,<2", "pydantic>=2,<3", "pydantic-settings>=2,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL database"]
[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
