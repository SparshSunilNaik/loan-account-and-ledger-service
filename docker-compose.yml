services:
  db:
    image: postgres:16.13
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgercore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_local_env.py first}
      POSTGRES_DB: ${POSTGRES_DB:-ledgercore}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ledgercore}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ledgercore}
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
  api:
    build: .
    environment:
      DEMO_AUTH_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ledgercore}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ledgercore}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
